openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RISE 성과관리 시스템 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: 인증
  - name: registration
    description: 사용자 등록 요청
  - name: projects
    description: 프로젝트 관리
  - name: tasks
    description: 단위과제 관리
  - name: indicators
    description: 지표 관리
  - name: targets
    description: 목표값 관리
  - name: results
    description: 실적 입력
  - name: evidence
    description: 증빙자료 관리
  - name: reviews
    description: 검토 관리
  - name: feedback
    description: 자체평가/환류
  - name: users
    description: 사용자 관리
  - name: dashboard
    description: 대시보드
  - name: settings
    description: 시스템 설정

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ───────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인 (직번/사번 + 비밀번호)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (pending/rejected/inactive)

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      responses:
        "200":
          description: OK

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 현재 로그인 사용자 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: 비밀번호 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized

  /auth/me/password:
    patch:
      operationId: updateMyPassword
      tags: [auth]
      summary: 내 비밀번호 변경 (현재 비밀번호 확인 후)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordBody"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized

  /auth/me/profile:
    patch:
      operationId: updateMyProfile
      tags: [auth]
      summary: 내 프로필 수정 (이름, 부서, 직위)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized

  # ── Registration Requests ─────────────────────────────────
  /registration-requests:
    post:
      operationId: createRegistrationRequest
      tags: [registration]
      summary: 사용자 등록 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequest"
        "400":
          description: Validation Error
        "409":
          description: Duplicate employeeNo or email
    get:
      operationId: listRegistrationRequests
      tags: [registration]
      summary: 등록 요청 목록 (ADMIN 이상)
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationRequest"

  /registration-requests/{id}/approve:
    patch:
      operationId: approveRegistrationRequest
      tags: [registration]
      summary: 등록 요청 승인
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"

  /registration-requests/{id}/reject:
    patch:
      operationId: rejectRegistrationRequest
      tags: [registration]
      summary: 등록 요청 반려
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequest"

  # ── Projects ──────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 프로젝트 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: 프로젝트 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: 프로젝트 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not Found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: 프로젝트 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: 프로젝트 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ── Tasks ─────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: 단위과제 목록
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: 단위과제 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: 단위과제 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not Found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: 단위과제 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: 단위과제 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ── Indicators ────────────────────────────────────────────
  /indicators:
    get:
      operationId: listIndicators
      tags: [indicators]
      summary: 지표 목록
      parameters:
        - name: taskId
          in: query
          schema:
            type: integer
        - name: parentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: indicatorType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Indicator"
    post:
      operationId: createIndicator
      tags: [indicators]
      summary: 지표 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndicatorBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicator"

  /indicators/{id}:
    get:
      operationId: getIndicator
      tags: [indicators]
      summary: 지표 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicator"
        "404":
          description: Not Found
    patch:
      operationId: updateIndicator
      tags: [indicators]
      summary: 지표 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndicatorBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicator"
    delete:
      operationId: deleteIndicator
      tags: [indicators]
      summary: 지표 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ── Indicator Targets ─────────────────────────────────────
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: 목표값 목록
      parameters:
        - name: indicatorId
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndicatorTarget"
    post:
      operationId: createTarget
      tags: [targets]
      summary: 목표값 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTargetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorTarget"

  /targets/{id}:
    patch:
      operationId: updateTarget
      tags: [targets]
      summary: 목표값 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTargetBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorTarget"
    delete:
      operationId: deleteTarget
      tags: [targets]
      summary: 목표값 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ── Indicator Results ─────────────────────────────────────
  /results:
    get:
      operationId: listResults
      tags: [results]
      summary: 실적 목록
      parameters:
        - name: indicatorId
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndicatorResult"
    post:
      operationId: createResult
      tags: [results]
      summary: 실적 입력
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResultBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResult"

  /results/{id}:
    get:
      operationId: getResult
      tags: [results]
      summary: 실적 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResult"
        "404":
          description: Not Found
    patch:
      operationId: updateResult
      tags: [results]
      summary: 실적 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResultBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResult"
    delete:
      operationId: deleteResult
      tags: [results]
      summary: 실적 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /results/{id}/submit:
    post:
      operationId: submitResult
      tags: [results]
      summary: 실적 제출
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorResult"

  # ── Evidence Files ─────────────────────────────────────────
  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: 증빙자료 목록
      parameters:
        - name: resultId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceFile"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: 증빙자료 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceFile"

  /evidence/{id}:
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      summary: 증빙자료 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /evidence/{id}/download:
    get:
      operationId: downloadEvidence
      tags: [evidence]
      summary: 증빙자료 다운로드 (로그인 및 권한 필요)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDownloadResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found

  # ── Reviews ───────────────────────────────────────────────
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: 검토 목록
      parameters:
        - name: resultId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: 검토 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ── Feedback Actions ───────────────────────────────────────
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: 자체평가/환류 목록
      parameters:
        - name: taskId
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackAction"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: 자체평가/환류 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackAction"

  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: 자체평가/환류 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedbackBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackAction"

  # ── Users ──────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 사용자 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDetail"

  /users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: 사용자 상태 변경
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"

  /users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: 사용자 권한 변경
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"

  /role-change-logs:
    get:
      operationId: listRoleChangeLogs
      tags: [users]
      summary: 권한 변경 이력
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleChangeLog"

  # ── Settings ──────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: 시스템 설정 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

    put:
      operationId: updateSettings
      tags: [settings]
      summary: 시스템 설정 변경 (관리자 전용)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "400":
          description: Bad Request
        "403":
          description: Forbidden

  # ── Dashboard ──────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: 대시보드 전체 요약
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/projects:
    get:
      operationId: getDashboardProjects
      tags: [dashboard]
      summary: 프로젝트별 진척도
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectProgress"

  /dashboard/tasks:
    get:
      operationId: getDashboardTasks
      tags: [dashboard]
      summary: 단위과제별 진척도
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskProgress"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: 위험/누락/보완요청 지표 목록
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAlerts"

  /dashboard/trend:
    get:
      operationId: getDashboardTrend
      tags: [dashboard]
      summary: 월별 목표 대비 실적 추이
      parameters:
        - name: projectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendDataPoint"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Projects ───────────────────────────────────────────
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        startYear:
          type: integer
        endYear:
          type: integer
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - startYear
        - endYear
        - status
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        startYear:
          type: integer
        endYear:
          type: integer
        status:
          type: string
      required:
        - name
        - startYear
        - endYear

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        startYear:
          type: integer
        endYear:
          type: integer
        status:
          type: string

    # ── Tasks ──────────────────────────────────────────────
    Task:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectId
        - name
        - status
        - createdAt
        - updatedAt

    CreateTaskBody:
      type: object
      properties:
        projectId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        status:
          type: string
      required:
        - projectId
        - name

    UpdateTaskBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        status:
          type: string

    # ── Indicators ─────────────────────────────────────────
    Indicator:
      type: object
      properties:
        id:
          type: integer
        taskId:
          type: integer
        parentId:
          type: ["integer", "null"]
        indicatorType:
          type: string
          description: "parent | child"
        name:
          type: string
        unit:
          type: ["string", "null"]
        formula:
          type: ["string", "null"]
        weight:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - taskId
        - indicatorType
        - name
        - createdAt
        - updatedAt

    CreateIndicatorBody:
      type: object
      properties:
        taskId:
          type: integer
        parentId:
          type: ["integer", "null"]
        indicatorType:
          type: string
        name:
          type: string
        unit:
          type: ["string", "null"]
        formula:
          type: ["string", "null"]
        weight:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
      required:
        - taskId
        - indicatorType
        - name

    UpdateIndicatorBody:
      type: object
      properties:
        parentId:
          type: ["integer", "null"]
        indicatorType:
          type: string
        name:
          type: string
        unit:
          type: ["string", "null"]
        formula:
          type: ["string", "null"]
        weight:
          type: ["number", "null"]
        description:
          type: ["string", "null"]

    # ── Indicator Targets ──────────────────────────────────
    IndicatorTarget:
      type: object
      properties:
        id:
          type: integer
        indicatorId:
          type: integer
        year:
          type: integer
        targetValue:
          type: ["number", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - indicatorId
        - year
        - createdAt

    CreateTargetBody:
      type: object
      properties:
        indicatorId:
          type: integer
        year:
          type: integer
        targetValue:
          type: ["number", "null"]
        note:
          type: ["string", "null"]
      required:
        - indicatorId
        - year

    UpdateTargetBody:
      type: object
      properties:
        targetValue:
          type: ["number", "null"]
        note:
          type: ["string", "null"]

    # ── Indicator Results ──────────────────────────────────
    IndicatorResult:
      type: object
      properties:
        id:
          type: integer
        indicatorId:
          type: integer
        year:
          type: integer
        actualValue:
          type: ["number", "null"]
        calculatedValue:
          type: ["number", "null"]
        progressRate:
          type: ["number", "null"]
        status:
          type: string
          description: "draft | submitted | reviewing | revision_requested | approved | rejected"
        selfEvaluation:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - indicatorId
        - year
        - status
        - createdAt
        - updatedAt

    CreateResultBody:
      type: object
      properties:
        indicatorId:
          type: integer
        year:
          type: integer
        actualValue:
          type: ["number", "null"]
        selfEvaluation:
          type: ["string", "null"]
      required:
        - indicatorId
        - year

    UpdateResultBody:
      type: object
      properties:
        actualValue:
          type: ["number", "null"]
        selfEvaluation:
          type: ["string", "null"]
        status:
          type: string

    # ── Evidence Files ─────────────────────────────────────
    EvidenceFile:
      type: object
      properties:
        id:
          type: integer
        resultId:
          type: integer
        fileName:
          type: string
        fileUrl:
          type: string
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        uploadedBy:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - resultId
        - fileName
        - fileUrl
        - createdAt

    CreateEvidenceBody:
      type: object
      properties:
        resultId:
          type: integer
        fileName:
          type: string
        fileUrl:
          type: string
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        uploadedBy:
          type: ["string", "null"]
      required:
        - resultId
        - fileName
        - fileUrl

    EvidenceDownloadResponse:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        fileUrl:
          type: string
      required:
        - id
        - fileName
        - fileUrl

    # ── Reviews ────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: integer
        resultId:
          type: integer
        reviewerName:
          type: string
        reviewStatus:
          type: string
          description: "approved | revision_requested | rejected"
        comment:
          type: ["string", "null"]
        reviewedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - resultId
        - reviewerName
        - reviewStatus
        - reviewedAt
        - createdAt

    CreateReviewBody:
      type: object
      properties:
        resultId:
          type: integer
        reviewerName:
          type: string
        reviewStatus:
          type: string
        comment:
          type: ["string", "null"]
      required:
        - resultId
        - reviewerName
        - reviewStatus

    # ── Feedback Actions ───────────────────────────────────
    FeedbackAction:
      type: object
      properties:
        id:
          type: integer
        taskId:
          type: integer
        year:
          type: integer
        evaluationContent:
          type: ["string", "null"]
        improvementPlan:
          type: ["string", "null"]
        actionStatus:
          type: string
          description: "planned | in_progress | completed"
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - taskId
        - year
        - actionStatus
        - createdAt
        - updatedAt

    CreateFeedbackBody:
      type: object
      properties:
        taskId:
          type: integer
        year:
          type: integer
        evaluationContent:
          type: ["string", "null"]
        improvementPlan:
          type: ["string", "null"]
        actionStatus:
          type: string
        dueDate:
          type: ["string", "null"]
      required:
        - taskId
        - year

    UpdateFeedbackBody:
      type: object
      properties:
        evaluationContent:
          type: ["string", "null"]
        improvementPlan:
          type: ["string", "null"]
        actionStatus:
          type: string
        dueDate:
          type: ["string", "null"]

    # ── Auth ───────────────────────────────────────────────
    LoginBody:
      type: object
      properties:
        employeeNo:
          type: string
        password:
          type: string
      required:
        - employeeNo
        - password

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        employeeNo:
          type: string
        email:
          type: string
        role:
          type: string
          description: "super_admin | admin | project_manager | task_manager | reviewer | viewer"
        department:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        status:
          type: string
        mustChangePassword:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - employeeNo
        - email
        - role
        - status
        - mustChangePassword

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
        newPasswordConfirm:
          type: string
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirm

    UpdateMyPasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
        newPasswordConfirm:
          type: string
      required:
        - currentPassword
        - newPassword
        - newPasswordConfirm

    UpdateMyProfileBody:
      type: object
      properties:
        name:
          type: string
        department:
          type: ["string", "null"]
        position:
          type: ["string", "null"]

    RequestPasswordResetBody:
      type: object
      properties:
        employeeNo:
          type: string
        name:
          type: string
        email:
          type: string
        currentPassword:
          type: string
      required:
        - employeeNo
        - name
        - email
        - currentPassword

    RequestPasswordResetResponse:
      type: object
      properties:
        ok:
          type: boolean
        maskedEmail:
          type: string
      required:
        - ok
        - maskedEmail

    ConfirmPasswordResetBody:
      type: object
      properties:
        employeeNo:
          type: string
        otp:
          type: string
        newPassword:
          type: string
        newPasswordConfirm:
          type: string
      required:
        - employeeNo
        - otp
        - newPassword
        - newPasswordConfirm
    # ── Registration Requests ──────────────────────────────
    CreateRegistrationRequestBody:
      type: object
      properties:
        employeeNo:
          type: string
        email:
          type: string
        name:
          type: string
        department:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        password:
          type: string
        passwordConfirm:
          type: string
        requestReason:
          type: ["string", "null"]
      required:
        - employeeNo
        - email
        - name
        - password
        - passwordConfirm

    RegistrationRequest:
      type: object
      properties:
        id:
          type: integer
        employeeNo:
          type: string
        email:
          type: string
        name:
          type: string
        department:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        requestReason:
          type: ["string", "null"]
        status:
          type: string
          description: "pending | approved | rejected"
        reviewedBy:
          type: ["integer", "null"]
        reviewedAt:
          type: ["string", "null"]
        reviewComment:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - employeeNo
        - email
        - name
        - status
        - createdAt
        - updatedAt

    ReviewRequestBody:
      type: object
      properties:
        reviewComment:
          type: ["string", "null"]

    # ── Users ──────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          description: "super_admin | admin | project_manager | task_manager | reviewer | viewer"
        department:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - createdAt

    UserDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        employeeNo:
          type: string
        role:
          type: string
          description: "super_admin | admin | project_manager | task_manager | reviewer | viewer"
        status:
          type: string
          description: "active | inactive | pending | rejected | locked"
        department:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - employeeNo
        - role
        - status
        - createdAt

    UpdateUserStatusBody:
      type: object
      properties:
        status:
          type: string
          description: "active | inactive | locked"
      required:
        - status

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          description: "super_admin | admin | project_manager | task_manager | reviewer | viewer"
        reason:
          type: ["string", "null"]
      required:
        - role

    RoleChangeLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userEmployeeNo:
          type: string
        oldRole:
          type: string
        newRole:
          type: string
        changedBy:
          type: integer
        changerName:
          type: string
        changerEmployeeNo:
          type: string
        changerRole:
          type: string
        reason:
          type: ["string", "null"]
        changedAt:
          type: string
      required:
        - id
        - userId
        - userName
        - userEmployeeNo
        - oldRole
        - newRole
        - changedBy
        - changerName
        - changerEmployeeNo
        - changerRole
        - changedAt


    # ── Settings ──────────────────────────────────────────
    AppSettings:
      type: object
      properties:
        sessionTimeoutMinutes:
          type: integer
          description: "세션 타임아웃 시간 (분). 유효값: 15, 30, 60, 120"
      required:
        - sessionTimeoutMinutes

    UpdateSettingsBody:
      type: object
      properties:
        sessionTimeoutMinutes:
          type: integer
          description: "세션 타임아웃 시간 (분). 유효값: 15, 30, 60, 120"
      required:
        - sessionTimeoutMinutes

    # ── Dashboard ──────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: integer
        totalTasks:
          type: integer
        totalIndicators:
          type: integer
        overallProgress:
          type: number
        approvedCount:
          type: integer
        pendingCount:
          type: integer
        revisionCount:
          type: integer
        year:
          type: integer
      required:
        - totalProjects
        - totalTasks
        - totalIndicators
        - overallProgress
        - approvedCount
        - pendingCount
        - revisionCount
        - year

    ProjectProgress:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        progress:
          type: number
        taskCount:
          type: integer
        indicatorCount:
          type: integer
        approvedCount:
          type: integer
        isOverTarget:
          type: boolean
      required:
        - projectId
        - projectName
        - progress
        - taskCount
        - indicatorCount
        - approvedCount
        - isOverTarget

    TaskProgress:
      type: object
      properties:
        taskId:
          type: integer
        taskName:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        progress:
          type: number
        indicatorCount:
          type: integer
        approvedCount:
          type: integer
        missingEvidenceCount:
          type: integer
        isOverTarget:
          type: boolean
      required:
        - taskId
        - taskName
        - projectId
        - projectName
        - progress
        - indicatorCount
        - approvedCount
        - missingEvidenceCount
        - isOverTarget

    DashboardAlerts:
      type: object
      properties:
        atRiskIndicators:
          type: array
          items:
            $ref: "#/components/schemas/AlertIndicator"
        missingEvidenceIndicators:
          type: array
          items:
            $ref: "#/components/schemas/AlertIndicator"
        revisionRequestedIndicators:
          type: array
          items:
            $ref: "#/components/schemas/AlertIndicator"
      required:
        - atRiskIndicators
        - missingEvidenceIndicators
        - revisionRequestedIndicators

    AlertIndicator:
      type: object
      properties:
        indicatorId:
          type: integer
        indicatorName:
          type: string
        taskName:
          type: string
        projectName:
          type: string
        progress:
          type: ["number", "null"]
        status:
          type: ["string", "null"]
      required:
        - indicatorId
        - indicatorName
        - taskName
        - projectName

    TrendDataPoint:
      type: object
      properties:
        year:
          type: integer
        targetValue:
          type: ["number", "null"]
        actualValue:
          type: ["number", "null"]
        progress:
          type: ["number", "null"]
        projectName:
          type: ["string", "null"]
      required:
        - year
