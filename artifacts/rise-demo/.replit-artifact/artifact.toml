kind = "web"
previewPath = "/demo/"
title = "RISE 성과관리 데모"
version = "1.0.0"
id = "artifacts/rise-demo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/demo/" ]
localPort = 22200

[services.development]
run = "pnpm --filter @workspace/rise-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rise-demo", "run", "build" ]
publicDir = "artifacts/rise-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22200"
BASE_PATH = "/demo/"
